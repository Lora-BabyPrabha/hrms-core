{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <h2 class="text-primary">{{ resource.title }}</h2>
  <p class="text-muted"><strong>Category:</strong> {{ resource.category.name }}</p>
  <hr>
  <h5>Description</h5>
  <p>{{ resource.description }}</p>
 
  <h5 class="mt-4">Detailed Content</h5>
  <p>{{ resource.detail_content }}</p>
 
  <a href="{% url 'career_development' %}" class="btn btn-outline-secondary mt-4">⬅ Back</a>
</div>
{% endblock %}
