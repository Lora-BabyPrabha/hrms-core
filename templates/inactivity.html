<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Inactivity Logout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        /* Overlay background */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        /* Card style */
        .alert-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease-in-out;
        }
        .alert-card h3 {
            margin-bottom: 10px;
            color: #d9534f;
        }
        .alert-card p {
            margin-bottom: 15px;
        }
        .alert-card button {
            background: #d9534f;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .alert-card button:hover {
            background: #c9302c;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>Welcome!</h1>
    <p>This page will log you out after 2 minutes of inactivity.</p>

    <!-- Logout Card -->
    <div class="overlay" id="logoutOverlay">
        <div class="alert-card">
            <h3>Session Expiring</h3>
            <p>You will be logged out in <span id="countdownText">10</span> seconds.</p>
            <button onclick="stayLoggedIn()">Stay Logged In</button>
        </div>
    </div>

    <script>
        function inactivityTime() {
            let timer;
            let countdown;
            const warningTime = 110 * 1000; // 1 min 50 sec
            const landerUrl = "{% url 'index' %}"; // Redirect page

            function showWarningCard() {
                document.getElementById("logoutOverlay").style.display = "flex";

                let secondsLeft = 10;
                document.getElementById("countdownText").textContent = secondsLeft;

                countdown = setInterval(() => {
                    secondsLeft--;
                    document.getElementById("countdownText").textContent = secondsLeft;
                    if (secondsLeft <= 0) {
                        clearInterval(countdown);
                        window.location.href = landerUrl;
                    }
                }, 1000);
            }

            window.stayLoggedIn = function() {
                fetch("{% url 'stay_logged_in' %}", { 
                    method: "POST", 
                    headers: { 
                        "X-CSRFToken": getCSRFToken(),
                        "X-Requested-With": "XMLHttpRequest"
                    }
                })
                .then(() => {
                    hideWarningCard();
                    resetTimer();
                })
                .catch(() => {
                    window.location.href = landerUrl;
                });
            }

            function hideWarningCard() {
                document.getElementById("logoutOverlay").style.display = "none";
                clearInterval(countdown);
            }

            function resetTimer() {
                clearTimeout(timer);
                clearInterval(countdown);
                hideWarningCard();
                timer = setTimeout(showWarningCard, warningTime);
            }

            function getCSRFToken() {
                return document.cookie.split('; ')
                    .find(row => row.startsWith('csrftoken'))
                    ?.split('=')[1];
            }

            // Activity listeners
            window.onload = resetTimer;
            document.onmousemove = resetTimer;
            document.onkeydown = resetTimer;
            document.onclick = resetTimer;
            document.onscroll = resetTimer;
        }

        inactivityTime();
    </script>

</body>
</html>
