{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{{ training.title }}</h2>
    <p>{{ training.description }}</p>
    <p><strong>Content:</strong> {{ training.content }}</p>
    
    {% if training.video %}
        <div class="mb-3">
            <h5>Video:</h5>
            <video controls class="w-100">
                <source src="{{ training.video.url }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    {% endif %}

    {% if training.file %}
        <div class="mb-3">
            <h5>File:</h5>
            <a href="{{ training.file.url }}" class="btn btn-secondary">Download File</a>
        </div>
    {% endif %}
    <a href="{% url 'training' %}" class="btn btn-secondary">Back to Training</a>
</div>
{% endblock %}
